# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: "Blog | Lyndsy Simon"

docs_dir: src

nav:
  - index.md
  - tags.md

theme:
  name: material
  features:
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.follow
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - tags:
      tags_file: tags.md
  - search
  - blog:
      blog_dir: .
      post_date_format: long
      post_url_format: "{slug}"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra:
  generator: false
  social:
    - icon: fontawesome/brands/git-alt
      link: https://git.sr.ht/~lyndsysimon
    - icon: fontawesome/solid/envelope
      link: mailto:lyndsy@lyndsysimon.com
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/LyndsySimon
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/lyndsysimon
    - icon: fontawesome/brands/facebook
      link: https://facebook.com/LyndsySimon

copyright: <a href="https://git.sr.ht/~lyndsysimon/blog">site source</a>
