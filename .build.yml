image: archlinux
oauth: pages.sr.ht/PAGES:RW

packages:
  - hut

environment:
  site: lyndsysimon.com

tasks:
- package: |
    # Install uv
    curl -LsSf https://astral.sh/uv/install.sh | sh
    export PATH="$HOME/.cargo/bin:$PATH"
    # Build site
    uv sync
    uv run zensical build
    cd site
    tar -cvz . > ~/site.tar.gz
- upload: |
    hut pages publish -d $site ~/site.tar.gz
